<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; connect-src https: 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Rewards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07050f; --card1:#1a1336; --card2:#110c26;
  --gold1:#fff3b0; --gold2:#facc15; --gold3:#d4a017; --gold4:#7a5a0c;
  --line:rgba(250,204,21,.28); --line2:rgba(250,204,21,.55);
  --txt:#f4f1ff; --mut:#a79fc9;
  --green:#10b981; --red:#ef4444; --violet:#6366f1; --orange:#f97316;
  --disp:'Oswald','Arial Narrow','Impact',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:#07050f}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:500; color:var(--txt);
  background:
    radial-gradient(900px 520px at 50% -8%,#3a1a6e 0%,rgba(58,26,110,0) 62%),
    radial-gradient(700px 480px at 100% 32%,rgba(250,204,21,.10),rgba(250,204,21,0) 60%),
    linear-gradient(180deg,#0b0718,#07050f);
   min-height:100vh;
}

.wrap{max-width:520px;margin:0 auto;padding:16px 14px 118px;position:relative;z-index:1}
.display{font-family:var(--disp);font-weight:600;letter-spacing:.6px}


.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:var(--disp);font-weight:700;font-size:17px;color:#2b1a00;
  background:linear-gradient(135deg,#fff3b0,#d4a017);box-shadow:0 0 0 2px var(--line2),0 6px 18px rgba(250,204,21,.25)}
.logo img{width:100%;height:100%;object-fit:cover}
.brand-title{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.05;letter-spacing:1.2px;text-transform:uppercase;word-break:break-word;
  background:linear-gradient(180deg,#fff3b0,#facc15 55%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hello{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px 5px 5px;max-width:48%;min-width:0;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:600;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--line2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.hello-t{min-width:0;line-height:1.1}
.hello-t small{display:block;white-space:nowrap;color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.4px}
.hello-t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


.card{position:relative;background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:16px;margin-bottom:16px}
.card.gold{text-align:center;overflow:hidden;border:1px solid transparent;
  background:linear-gradient(#1a1233,#120b26) padding-box,linear-gradient(135deg,#fff3b0,#d4a017 45%,#7a5a0c) border-box;
  box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 28px rgba(250,204,21,.12)}
.card.gold:after{content:"777";position:absolute;right:10px;bottom:-14px;font-family:var(--disp);font-weight:700;font-size:84px;letter-spacing:4px;color:rgba(250,204,21,.07);pointer-events:none}
.card.cream{background:linear-gradient(180deg,#1d1538,#140e2b);text-align:center}
.label{font-family:var(--disp);font-weight:500;font-size:13px;letter-spacing:2.4px;color:var(--gold2);text-transform:uppercase;opacity:.9}
.amount{font-family:var(--disp);font-weight:700;font-size:58px;line-height:1.1;margin:2px 0 10px;
  background:linear-gradient(180deg,#fff7cc,#facc15 55%,#c98f0a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  }
.dashed{border:1px dashed var(--line2);border-radius:12px;background:rgba(250,204,21,.06);padding:9px 12px;font-size:13px;font-weight:600;line-height:1.3;color:#e8dfb8}
.center{text-align:center}
.h2{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:1px;text-transform:uppercase;text-align:center;margin:0 0 12px;color:#fff}
.sect-title{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold2);margin:4px 2px 14px}
.sect-title:before,.sect-title:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(250,204,21,0),rgba(250,204,21,.5))}
.sect-title:after{background:linear-gradient(90deg,rgba(250,204,21,.5),rgba(250,204,21,0))}


.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:600 16px 'Inter',sans-serif;letter-spacing:.5px;
  color:#fff;background:#0b0820;text-transform:uppercase;outline:none;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:#6f6896;text-transform:none;letter-spacing:0}
.input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(250,204,21,.15)}
.input.num{text-align:center;text-transform:none;font-family:var(--disp);font-size:22px;letter-spacing:1px}
.btn{display:block;width:100%;border:0;border-radius:14px;font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:1.4px;text-transform:uppercase;
  padding:14px 10px;color:#2b1a00;cursor:pointer;transition:transform .08s,filter .15s;margin:0 0 10px;
  background:linear-gradient(180deg,#fde047,#f59e0b);box-shadow:0 8px 20px rgba(245,158,11,.28),inset 0 1px 0 rgba(255,255,255,.55)}
.btn:last-child{margin-bottom:0}
.btn:active{transform:translateY(1px);filter:brightness(.95)}
.btn[disabled]{opacity:.5;pointer-events:none}
.b-yellow{background:linear-gradient(180deg,#fde047,#f59e0b);color:#2b1a00}
.b-green{background:linear-gradient(180deg,#34d399,#059669);color:#fff;box-shadow:0 8px 20px rgba(16,185,129,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.b-blue{background:linear-gradient(180deg,#818cf8,#4338ca);color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.3),inset 0 1px 0 rgba(255,255,255,.3)}
.b-orange{background:linear-gradient(180deg,#fb923c,#dc2626);color:#fff;box-shadow:0 8px 20px rgba(239,68,68,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.b-sm{display:inline-block;width:auto;font-size:14px;padding:9px 14px;border-radius:12px;margin:0;letter-spacing:1px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btnrow .btn{margin:0;font-size:15px;padding:13px 6px}


.vcard{position:relative;background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:14px 12px 14px;margin-bottom:16px;overflow:hidden}
.vcard:before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(250,204,21,.22) 0%,rgba(250,204,21,0) 70%);pointer-events:none}
.vhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative}
.vico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#fff3b0,#d4a017);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;box-shadow:0 0 0 2px var(--line2)}
.vtit{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.05;letter-spacing:1.4px;text-transform:uppercase;color:#fff}
.vsub{font-size:12px;color:var(--mut);font-weight:500;line-height:1.25;margin-top:3px}
.vpill{margin-left:auto;flex:none;border:1px solid var(--line2);border-radius:999px;background:rgba(250,204,21,.1);color:var(--gold2);padding:2px 11px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:1px}
.prog{height:8px;border-radius:999px;background:#0b0820;border:1px solid var(--line);overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#34d399);border-radius:999px;transition:width .5s}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);margin-bottom:8px}
.vrow.done{background:rgba(16,185,129,.09);border-color:rgba(16,185,129,.55)}
.vav{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;color:#fff;flex:none;font-size:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.vmid{flex:1;min-width:0;line-height:1.15}
.vmid b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmid small{font-size:11px;font-weight:600;color:var(--mut)}
.vrow.done .vmid small{color:#34d399}
.vgo{flex:none;border:0;border-radius:10px;padding:8px 16px;font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;color:#fff;margin:0}
.vgo:active{transform:translateY(1px)}
.vgo[disabled]{opacity:.45;pointer-events:none}
.vgo.blue{background:linear-gradient(180deg,#818cf8,#4338ca);box-shadow:0 4px 12px rgba(99,102,241,.35)}
.vgo.orange{background:linear-gradient(180deg,#fb923c,#dc2626);box-shadow:0 4px 12px rgba(239,68,68,.35)}
.vtick{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#34d399,#059669);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;box-shadow:0 0 12px rgba(16,185,129,.45)}
.vhint{font-size:11px;color:var(--mut);font-weight:500;text-align:center;margin:4px 0 12px}


.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:12px;background:#0b0820;font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:1px;padding:10px 0;text-align:center;cursor:pointer;color:#fff;transition:background .15s,color .15s}
.chip.sel{background:linear-gradient(180deg,#fde047,#f59e0b);color:#2b1a00;border-color:transparent;box-shadow:0 6px 16px rgba(245,158,11,.3)}
.chip:active{transform:translateY(1px)}
.uid-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.uid-lab{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:1.6px}
.uid-val{font-family:var(--disp);font-weight:600;font-size:28px;letter-spacing:2px;word-break:break-all;line-height:1.15;color:var(--gold2)}
.note{font-size:12px;color:#c9b26b;font-weight:600;text-align:center;margin-top:8px;line-height:1.35}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--mut);font-weight:500}
.pill{border:1px solid;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.pill.paid{background:rgba(16,185,129,.14);color:#34d399;border-color:rgba(16,185,129,.55)}
.pill.pending{background:rgba(250,204,21,.12);color:#facc15;border-color:rgba(250,204,21,.5)}
.pill.rejected{background:rgba(239,68,68,.14);color:#f87171;border-color:rgba(239,68,68,.55)}
.empty{color:var(--mut);text-align:center;padding:12px 0;font-weight:500;font-size:14px}
.rules{text-align:left;font-size:13px;line-height:1.45;font-weight:500;color:#d9d2f3}
.rules h3{margin:0 0 10px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2)}
.rules p{margin:0 0 8px;padding-left:2px}
.codebox{border:1px dashed var(--gold2);background:rgba(250,204,21,.07);color:var(--gold2);border-radius:14px;
  font-family:var(--disp);font-weight:700;font-size:34px;letter-spacing:5px;text-align:center;padding:14px 8px;margin-bottom:12px;word-break:break-all;user-select:all;
  text-shadow:0 0 16px rgba(250,204,21,.35)}


.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(92vw,500px);background:rgba(13,10,31,.92);
  border:1px solid var(--line2);border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.6);display:flex;padding:6px;gap:6px;z-index:20}
.nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:12px 6px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:1.6px;color:var(--mut);text-transform:uppercase;cursor:pointer}
.nav button.on{background:linear-gradient(180deg,#fde047,#f59e0b);color:#2b1a00;box-shadow:0 6px 16px rgba(245,158,11,.3)}


.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:#150f2e;color:#fff;border:1px solid var(--line2);border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;z-index:60;
  max-width:88vw;text-align:center;transition:.25s;box-shadow:0 10px 26px rgba(0,0,0,.55)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(4,2,12,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal .card{width:100%;max-width:420px;margin:0}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:var(--mut)}
.spin{width:46px;height:46px;border:4px solid rgba(250,204,21,.2);border-top-color:var(--gold2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}


html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.codebox{-webkit-user-select:none;user-select:none}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fx span{position:absolute;bottom:-40px;font-size:22px;opacity:0;animation:rise linear infinite;}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.5}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.ticker{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:999px;margin:0 0 14px;background:linear-gradient(90deg,#1a0f3a,#2a1250,#1a0f3a);
  box-shadow:0 0 18px rgba(250,204,21,.12),inset 0 0 12px rgba(0,0,0,.5)}
.ticker div{display:inline-block;white-space:nowrap;padding:7px 0;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:2.4px;color:var(--gold2);animation:tick 22s linear infinite}
.ticker b{color:#fff;margin:0 14px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.logo{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px var(--line2),0 6px 18px rgba(250,204,21,.25)}50%{box-shadow:0 0 0 2px var(--gold2),0 0 26px rgba(250,204,21,.65)}}
.card.gold{padding:18px 16px 16px}
.card.gold:before{content:"";position:absolute;left:10px;right:10px;top:5px;height:6px;
  background:radial-gradient(circle,#fff3b0 0 2px,transparent 2.6px) 0 0/16px 6px repeat-x;animation:bulbs 1.1s steps(2) infinite;opacity:.9}
@keyframes bulbs{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.amount{position:relative;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{}50%{}}
.btn{position:relative;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;transform:skewX(-22deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.38),rgba(255,255,255,0));animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-70%}100%{left:130%}}
.b-sm:after,.vgo:after{display:none}
.card{}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}
.stat{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#1a1336,#110c26);text-align:center;padding:10px 4px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.stat i{display:block;font-style:normal;font-size:20px;line-height:1}
.stat b{display:block;font-family:var(--disp);font-weight:700;font-size:20px;color:var(--gold2);margin-top:4px;letter-spacing:.5px}
.stat small{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;margin-top:2px}
.nav{padding:6px;border-radius:22px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;font-size:13px}
.nav button i{font-style:normal;font-size:19px;line-height:1}
.nav button.on i{}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 0;color:#6f6896;font-size:11px;font-weight:600;letter-spacing:.4px}
.v-sub{font-size:15px;font-weight:600;line-height:1.4;margin:10px 0 16px;color:#e6e0ff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}


:root{--neon:#ff2d6f;--neon2:#a855f7}
.card.gold{border:2px solid transparent;
  background:linear-gradient(#1c1236,#0f0922) padding-box,conic-gradient(from var(--ang,0deg),#fff3b0,#ff2d6f,#a855f7,#facc15,#fff3b0) border-box;
  animation:spinb 6s linear infinite;box-shadow:0 0 30px rgba(168,85,247,.28),0 0 50px rgba(255,45,111,.12),0 14px 34px rgba(0,0,0,.55)}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinb{to{--ang:360deg}}
.card.gold:after{content:"7 7 7";letter-spacing:10px;color:rgba(250,204,21,.06);right:-6px}
.reel{position:relative;margin:6px auto 12px;max-width:330px;border-radius:16px;padding:6px 10px;
  background:linear-gradient(180deg,#030208,#120a2a 50%,#030208);border:2px solid #d4a017;
  box-shadow:inset 0 0 22px rgba(0,0,0,.9),0 0 0 3px #3a2a08,0 0 22px rgba(250,204,21,.25)}
.reel:before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,45,111,.7),transparent);transform:translateY(-1px)}
.reel .amount{font-size:50px}
.label{text-shadow:0 0 12px rgba(250,204,21,.5)}
.sect-title{color:#fff;text-shadow:0 0 12px rgba(255,45,111,.6)}
.sect-title:before,.sect-title:after{background:linear-gradient(90deg,rgba(255,45,111,0),rgba(255,45,111,.8))}
.sect-title:after{background:linear-gradient(90deg,rgba(255,45,111,.8),rgba(255,45,111,0))}
.btn.b-yellow{background:linear-gradient(180deg,#ffe066,#f59e0b 55%,#d97706);box-shadow:0 8px 22px rgba(245,158,11,.4),0 0 0 2px rgba(255,243,176,.25),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.b-green{box-shadow:0 8px 22px rgba(16,185,129,.4),0 0 0 2px rgba(110,231,183,.2),inset 0 1px 0 rgba(255,255,255,.4)}
.codebox{border:2px dashed var(--neon);background:linear-gradient(180deg,rgba(255,45,111,.1),rgba(168,85,247,.1));color:#fff;
  text-shadow:0 0 10px var(--gold2),0 0 22px rgba(250,204,21,.6)}
.stat{border-color:rgba(168,85,247,.5);box-shadow:0 8px 20px rgba(0,0,0,.4),0 0 14px rgba(168,85,247,.15)}
.stat b{text-shadow:0 0 10px rgba(250,204,21,.45)}
.vico{font-size:22px}
.nav{border-color:rgba(255,45,111,.55);box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 22px rgba(255,45,111,.18)}
.nav button.on{background:linear-gradient(180deg,#ff5c8a,#e11d48);color:#fff;box-shadow:0 6px 18px rgba(255,45,111,.4)}
.chip.sel{background:linear-gradient(180deg,#ff5c8a,#e11d48);color:#fff;box-shadow:0 6px 16px rgba(255,45,111,.4)}
.logo{font-size:24px}


.ic{display:inline-flex;vertical-align:-.2em;line-height:0;}
.ic svg{display:block}
.fx .ic{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
.ticker b{display:inline-flex;vertical-align:middle;margin:0 16px}
.top{margin-bottom:10px}
.avatar{width:42px;height:42px;font-size:16px}
.welcome{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:10px 14px;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(90deg,rgba(168,85,247,.22),rgba(255,45,111,.12) 60%,rgba(250,204,21,.08));box-shadow:0 8px 22px rgba(0,0,0,.35)}
.wic{width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.wt{min-width:0;flex:1;line-height:1.15}
.wt small{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.6px}
.wt b{display:block;font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.vip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(250,204,21,.1);
  font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:1.6px;color:var(--gold2)}
.bigic{display:flex;justify-content:center;margin:2px 0 4px}
.btn .ic,.vgo .ic{vertical-align:-.25em;margin-right:4px;filter:none}
.vtick .ic{}
.vico .ic{}
.stat i{display:flex;justify-content:center}
.nav button i{display:flex;justify-content:center}
.nav button.on i .ic{}
.nav button:not(.on) i{opacity:.75}
.h2 .ic,.label .ic,.sect-title .ic{vertical-align:-.22em;margin:0 3px}
.dashed .ic,.note .ic{vertical-align:-.22em;margin-right:2px}

.top{margin-bottom:16px;gap:8px}
.brand{flex:1 1 auto;min-width:0}
.brand-title{font-size:19px}
.avatar{width:34px;height:34px;font-size:14px}
.hello{flex:0 0 auto;max-width:none;padding:5px 14px 5px 5px}
.hello-t small{white-space:nowrap;font-size:11px}
.hello-t b{max-width:96px}


.chipL,.chipR{position:absolute;pointer-events:none;opacity:.95;animation:chipspin 9s linear infinite}
.chipL{left:-16px;top:34px}
.chipR{right:-14px;top:30px;animation-direction:reverse}
@keyframes chipspin{to{transform:rotate(360deg)}}
.chipL .ic,.chipR .ic{}
.promo{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:14px 12px;border-radius:20px;overflow:hidden;
  background:linear-gradient(110deg,#be123c,#7c1d8f 45%,#4c1d95);border:1px solid rgba(255,243,176,.55);
  box-shadow:0 12px 28px rgba(190,18,60,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.promo:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22),rgba(255,255,255,0));animation:shine 4s ease-in-out infinite}
.promo-ic{flex:none;animation:chipspin 12s linear infinite}
.promo-ic.r{animation:none}
.promo-t{flex:1;min-width:0;line-height:1.2;text-align:left}
.promo-t small{display:block;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:3px;color:#ffe9a0}
.promo-t b{display:block;font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:.8px;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.35);margin:1px 0 2px}
.promo-t span{display:block;font-size:11px;font-weight:600;color:#f4d9ff;opacity:.9}
.card.felt{background:radial-gradient(130% 100% at 50% 0%,#127a4c 0%,#0b4a33 50%,#06281c 100%);border:2px solid rgba(250,204,21,.7);
  box-shadow:0 14px 32px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.35),0 0 0 3px rgba(122,90,12,.5)}
.card.felt .codebox{position:relative;background:rgba(0,0,0,.28);border:2px dashed #ffe066;color:#fff}
.card.felt .codebox:before,.card.felt .codebox:after{content:"";position:absolute;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:#0a4230;border:2px solid #ffe066}
.card.felt .codebox:before{left:-12px}.card.felt .codebox:after{right:-12px}
.card.felt .b-blue{background:linear-gradient(180deg,#ffe066,#f59e0b);color:#2b1a00;box-shadow:0 8px 20px rgba(245,158,11,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.card.felt .b-green{background:linear-gradient(180deg,#ff5c8a,#e11d48);color:#fff;box-shadow:0 8px 20px rgba(225,29,72,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.btn{border-bottom:3px solid rgba(0,0,0,.25)}
.stat{position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(250,204,21,.14),transparent 65%)}
.sect-title .ic{margin:0}
.vcard{border:1px solid rgba(255,45,111,.45);box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 26px rgba(168,85,247,.2)}
.logo{border-radius:50%}


:root{--line:rgba(212,160,23,.30);--line2:rgba(212,160,23,.60)}
body{background:radial-gradient(900px 520px at 50% -10%,#241a3d 0%,rgba(36,26,61,0) 60%),linear-gradient(180deg,#0c0a14,#07060d)}

.fx,.ticker,.chipL,.chipR{display:none!important}
.card.gold:before{display:none}
.card.gold{animation:none;border:1px solid transparent;
  background:linear-gradient(#17112b,#0e0a1d) padding-box,linear-gradient(135deg,#fff3b0,#d4a017 45%,#7a5a0c) border-box;
  box-shadow:0 16px 36px rgba(0,0,0,.55),0 0 24px rgba(212,160,23,.12);padding:18px 16px 16px}
.card.gold:after{content:"";display:none}

.amount{animation:none;}
.reel{background:linear-gradient(180deg,#05040a,#0f0a22 50%,#05040a);border:1px solid #b8860b;box-shadow:inset 0 0 18px rgba(0,0,0,.9),0 0 0 3px rgba(122,90,12,.35)}
.reel:before{background:linear-gradient(90deg,transparent,rgba(212,160,23,.35),transparent)}
.label{text-shadow:none;letter-spacing:2.6px;font-size:12px}
.btn{border-bottom:0;animation:none}
.btn:after{display:none}
.b-yellow,.btn.b-yellow{background:linear-gradient(180deg,#f7d34a,#d99a0b);box-shadow:0 6px 16px rgba(217,154,11,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.b-green,.btn.b-green{background:linear-gradient(180deg,#34c58c,#0b8a5f);box-shadow:0 6px 16px rgba(16,185,129,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.b-blue{background:linear-gradient(180deg,#2a2347,#1b1533);color:#f3d77a;border:1px solid var(--line2);box-shadow:none}

.card.felt .b-green{background:linear-gradient(180deg,#f7d34a,#d99a0b);color:#2b1a00;box-shadow:0 6px 16px rgba(217,154,11,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.sect-title{color:var(--gold2);text-shadow:none;font-size:13px;letter-spacing:2.6px}
.sect-title:before{background:linear-gradient(90deg,rgba(212,160,23,0),rgba(212,160,23,.6))}
.sect-title:after{background:linear-gradient(90deg,rgba(212,160,23,.6),rgba(212,160,23,0))}
.sect-title .ic{display:none}

.stat b{text-shadow:none}
.stat:before{display:none}
.promo{background:linear-gradient(110deg,#1d1535,#2b1f4d 55%,#1d1535);border:1px solid var(--line2);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.promo:after{display:none}
.promo-ic{animation:none}
.promo-t small{color:var(--gold2)}
.promo-t b{text-shadow:none}
.promo-t span{color:#b9b0d8}
.card.felt{background:linear-gradient(180deg,#17112b,#0e0a1d);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.card.felt .codebox{background:rgba(212,160,23,.07);border:1px dashed var(--gold2);color:var(--gold2)}
.card.felt .codebox:before,.card.felt .codebox:after{background:#0e0a1d;border:1px solid var(--gold2)}
.codebox{text-shadow:none;color:var(--gold2);border:1px dashed var(--gold2);background:rgba(212,160,23,.07)}
.nav{border-color:var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.6)}
.nav button.on{background:linear-gradient(180deg,#f7d34a,#d99a0b);color:#2b1a00;box-shadow:0 6px 14px rgba(217,154,11,.3)}
.chip.sel{background:linear-gradient(180deg,#f7d34a,#d99a0b);color:#2b1a00;box-shadow:0 6px 14px rgba(217,154,11,.3)}
.vcard{border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.ic{filter:none}
.hello{background:rgba(255,255,255,.04)}
.h2{letter-spacing:1.2px;font-size:15px}
